# nginx reverse proxy: multiplexes HTTP + gRPC on a single TLS port (443).
#
# Why: Imperva's AWS vPOP only forwards to the origin on 443, so the origin must
# serve BOTH the web app and gRPC on 443. Express (HTTP/1.1) and @grpc/grpc-js
# (its own HTTP/2 server) can't share a port inside the Node process, so nginx
# terminates TLS on 443 and path-routes:
#   - gRPC service paths        -> grpc-js  (h2c) on echo-server:50051
#   - everything else (HTTP/WS) -> Express        on echo-server:8080
#
# Public TLS is terminated here; the nginx->echo-server hop is plaintext on the
# trusted Docker network (echo-server runs gRPC as plaintext h2c — no GRPC_TLS).

worker_processes auto;
events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    error_log  /dev/stderr;

    client_max_body_size 10m;   # match the app's MAX_PAYLOAD_BYTES (10mb)

    # WebSocket upgrade passthrough for /ws
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream echo_http { server echo-server:8080; }
    upstream echo_grpc { server echo-server:50051; }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # --- gRPC -> grpc-js backend (plaintext h2c on the internal network) ---
        # GoTestWAF's actual service:
        location /encoder.ServiceFooBar/                    { grpc_pass grpc://echo_grpc; }
        # The echo server's own service (for manual grpcurl):
        location /echo.EchoService/                         { grpc_pass grpc://echo_grpc; }
        # gRPC reflection (so `grpcurl ... list` works through the proxy):
        location /grpc.reflection.v1alpha.ServerReflection/ { grpc_pass grpc://echo_grpc; }
        location /grpc.reflection.v1.ServerReflection/      { grpc_pass grpc://echo_grpc; }

        # --- everything else -> HTTP/REST/GraphQL/WebSocket echo ---
        location / {
            proxy_pass http://echo_http;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
        }
    }
}
