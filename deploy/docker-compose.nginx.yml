# Behind-a-WAF deployment: nginx sidecar multiplexes HTTP + gRPC on 443.
#
# Use this instead of the repo-root docker-compose.yml when the origin sits
# behind a proxy (Imperva vPOP / CloudFront) that only forwards to :443. nginx
# terminates TLS on 443 and path-routes gRPC -> echo-server:50051 (h2c), all
# other traffic -> echo-server:8080. The echo-server itself is internal-only.
#
# Prereq: a TLS cert at ../certs/{fullchain,privkey}.pem (Let's Encrypt in prod;
# self-signed for local tests). Run from the repo root:
#
#   docker compose -f deploy/docker-compose.nginx.yml up -d --build
#
# Then point Imperva's single site at origin.waaplabs.com:443 (forward all), and
# CloudFront's gRPC behavior (/encoder.ServiceFooBar/*) at the same Imperva
# origin with the gRPC toggle on.

services:
  echo-server:
    build:
      context: ..
      dockerfile: Dockerfile
    image: gotestwaf-echo-server:latest
    container_name: gotestwaf-echo-server
    # Internal only — nginx owns the public interface. gRPC stays plaintext
    # h2c (no GRPC_TLS); the public TLS is terminated by nginx on 443.
    expose:
      - "8080"    # HTTP/REST/GraphQL/WebSocket
      - "50051"   # gRPC (h2c)
    environment:
      - HTTP_PORT=8080
      - GRPC_PORT=50051
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - waf-test-network

  nginx:
    image: nginx:1.27-alpine
    container_name: gotestwaf-nginx
    depends_on:
      echo-server:
        condition: service_healthy
    ports:
      - "443:443"    # public HTTPS + gRPC, path-multiplexed
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../certs:/etc/nginx/certs:ro
    restart: unless-stopped
    networks:
      - waf-test-network

networks:
  waf-test-network:
    driver: bridge
